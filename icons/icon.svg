<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Fond -->
  <rect width="128" height="128" rx="24" fill="#1a1a2e"/>

  <!-- Carte arrière : suggère "plusieurs captures" (galerie) -->
  <rect x="24" y="22" width="66" height="52" rx="10" fill="#33335c"/>

  <!-- Carte avant, avec un repère "photo" simple et épais pour rester
       lisible même en 16px (barre horizontale + point = coin replié /
       aperçu d'image, plus robuste qu'un glyphe fin type montagnes). -->
  <rect x="38" y="40" width="66" height="52" rx="10" fill="#00d9ff"/>
  <circle cx="55" cy="57" r="6" fill="#1a1a2e"/>
  <rect x="48" y="72" width="46" height="9" rx="4.5" fill="#1a1a2e"/>
</svg>

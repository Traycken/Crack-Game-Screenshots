<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Réglages</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>Tailles des éléments</h1>

  <div class="field">
    <div class="field-label">
      <label for="galleryColumns">Screenshots par ligne</label>
      <span class="value" id="galleryColumnsValue">3</span>
    </div>
    <input type="range" id="galleryColumns" min="1" max="8" step="1">
  </div>

  <hr>

  <div class="field checkbox-field">
    <label for="noLimit">Largeur de page illimitée</label>
    <input type="checkbox" id="noLimit">
  </div>

  <div class="field">
    <div class="field-label">
      <label for="maxContentWidth">Largeur max. de la page</label>
      <span class="value" id="maxContentWidthValue">1600px</span>
    </div>
    <input type="range" id="maxContentWidth" min="800" max="3840" step="40">
  </div>

  <button id="resetBtn">Réinitialiser</button>

  <script src="popup.js"></script>
</body>
</html>

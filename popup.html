<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Réglages</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>Tailles des éléments</h1>

  <div class="site-links" id="siteLinks"></div>

  <p class="site-label" id="siteLabel"></p>

  <div id="unsupported" class="unsupported" hidden>
    Ouvrez une page IGG-Games, PCGamesTorrents ou SkidrowReloaded pour régler
    les tailles : les réglages sont indépendants pour chaque site.
  </div>

  <div id="fields">
    <div class="field">
      <div class="field-label">
        <label for="galleryColumns">Nombre de ligne</label>
        <span class="value" id="galleryColumnsValue">3</span>
      </div>
      <input type="range" id="galleryColumns" min="1" max="8" step="1">
    </div>

    <div class="field">
      <div class="field-label">
        <label for="galleryRows">Screenshots par colone</label>
        <span class="value" id="galleryRowsValue">2</span>
      </div>
      <input type="range" id="galleryRows" min="1" max="4" step="1">
    </div>

    <hr>

    <div class="field">
      <div class="field-label">
        <label for="maxTotalScreenshots">Limite max. de captures</label>
        <span class="value" id="maxTotalScreenshotsValue">30</span>
      </div>
      <input type="range" id="maxTotalScreenshots" min="3" max="50" step="1">
    </div>

    <hr>

    <div class="field">
      <div class="field-label">
        <label for="maxContentWidth">Largeur max. de la page</label>
        <span class="value" id="maxContentWidthValue">66.7%</span>
      </div>
      <input type="range" id="maxContentWidth" min="20" max="100" step="0.1">
    </div>

    <button id="resetBtn">Réinitialiser</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
